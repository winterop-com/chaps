[package]
name = "chaps-cli"
version = "0.2.12"
edition = "2024"
description = "Deploy and manage CHAP, the Climate Health Analytics Platform, with Docker Compose"
license = "AGPL-3.0-only"
repository = "https://github.com/winterop-com/chaps"

[[bin]]
name = "chaps"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
ureq = { version = "3.4", features = ["json"] }
anyhow = "1"
thiserror = "2"
ratatui = "0.30"
crossterm = "0.29"
getrandom = "0.3"
console = "0.16.6"

[dev-dependencies]
tempfile = "3"
regex = "1"
assert_cmd = "2"
predicates = "3"
