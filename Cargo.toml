[package]
name = "varde"
version = "0.100.0"
edition = "2024"
rust-version = "1.91"
description = "Deploy Chap (climate-informed disease forecasting) and its services with Docker Compose"
license = "AGPL-3.0-only"
repository = "https://github.com/winterop-com/varde"

[[bin]]
name = "varde"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
ureq = { version = "3.4", features = ["json"] }
anyhow = "1"
thiserror = "2.0.21"
ratatui = "0.30"
crossterm = "0.29"
getrandom = "0.4"
console = "0.16.6"
ctrlc = { version = "3", features = ["termination"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
tempfile = "3"
regex = "1"
assert_cmd = "2"
predicates = "3"
