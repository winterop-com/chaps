name: ci
run-name: ${{ github.workflow }} ${{ github.ref_name }} (${{ github.event.head_commit.message || github.event_name }})

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # install.sh is what `curl | sh` runs, so it is POSIX sh rather than
      # bash and is checked as such. The rest of scripts/ is bash.
      - name: Lint install.sh
        run: shellcheck -s sh install.sh

      - name: Lint scripts/
        run: shellcheck scripts/*.sh
