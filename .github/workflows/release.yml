name: release
run-name: release ${{ github.ref_name }}

# Builds `chaps` for six targets natively, plus a universal macOS binary, and
# attaches the archives to the GitHub release for the tag.
#
# macOS archives are signed with a Developer ID Application certificate and
# notarized by Apple when these repository (or organisation) secrets are set.
# Without them the macOS build still succeeds and ships an UNSIGNED binary:
#
#   APPLE_CERTIFICATE            base64 of the exported Developer ID
#                                Application certificate (.p12)
#   APPLE_CERTIFICATE_PASSWORD   the .p12 export password
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                     the Apple ID email
#   APPLE_PASSWORD               an app-specific password (appleid.apple.com)
#   APPLE_TEAM_ID                the 10-character Team ID
#
# `scripts/github-secrets.sh` sets all six from 1Password.
#
# Windows binaries are not signed: that needs an Authenticode certificate,
# which is a separate purchase, so SmartScreen may warn on first run. The
# Linux builds are static musl and have nothing to sign.

on:
  push:
    tags: ["v*"]
  # Lets the build matrix be exercised without cutting a release; the publish
  # job below only runs for a tag. Signing still happens on a dispatch run if
  # the secrets are present, so the signing path is exercised too.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The packaging steps run the binary they just built, to generate the
  # completion scripts. Nothing in a release build should reach out to the
  # release feed while doing it.
  CHAPS_NO_UPDATE_CHECK: "1"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # `secrets` is not available in a step-level `if:`, so whether the signing
    # certificate exists is hoisted into a job-level env var and the macOS
    # steps test that. The value is the string "true" or "false"; no secret
    # material is exposed.
    env:
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target is built natively, so no cross-compilation toolchains.
          # Linux builds are static (musl) so one binary runs on any distro.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Signing happens between the build and the packaging so the archive
      # contains the signed binary.
      - name: Sign and notarize
        if: runner.os == 'macOS' && env.HAS_APPLE == 'true'
        uses: ./.github/actions/sign-macos
        with:
          binary: target/${{ matrix.target }}/release/chaps
          label: ${{ matrix.target }}
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_PASSWORD }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}

      # Every target is built natively, so the binary that was just built is
      # the one that generates its own completion scripts.
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*) version="$GITHUB_REF_NAME" ;;
            *) version="dev-${GITHUB_SHA:0:7}" ;;
          esac
          # The archive is named after the target alone: the tag is already
          # in the download URL, and one name per target is also what
          # releases/latest/download/<name> needs. The directory inside the
          # archive keeps the version, because that is what someone sees
          # after unpacking it.
          dir="chaps-${version}-${{ matrix.target }}"
          asset="chaps-${{ matrix.target }}.tar.gz"
          binary="target/${{ matrix.target }}/release/chaps"
          mkdir -p "dist/$dir/completions"
          cp "$binary" "dist/$dir/"
          cp README.md "dist/$dir/"
          if [ -f LICENSE ]; then cp LICENSE "dist/$dir/"; fi
          "$binary" completions bash       > "dist/$dir/completions/chaps.bash"
          "$binary" completions zsh        > "dist/$dir/completions/_chaps"
          "$binary" completions fish       > "dist/$dir/completions/chaps.fish"
          "$binary" completions powershell > "dist/$dir/completions/_chaps.ps1"
          tar -czf "dist/$asset" -C dist "$dir"
          rm -rf "dist/$dir"

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = if ($env:GITHUB_REF -like "refs/tags/*") {
            $env:GITHUB_REF_NAME
          } else {
            "dev-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          # The zip is named after the target alone; the directory inside
          # it keeps the version. See the tar.gz step.
          $dir = "chaps-$version-${{ matrix.target }}"
          $asset = "chaps-${{ matrix.target }}.zip"
          # Absolute, so the call operator below cannot mistake it for a
          # command name.
          $binary = Join-Path $PWD "target/${{ matrix.target }}/release/chaps.exe"
          New-Item -ItemType Directory -Force -Path "dist/$dir/completions" | Out-Null
          Copy-Item $binary "dist/$dir/"
          Copy-Item "README.md" "dist/$dir/"
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "dist/$dir/" }
          # Written byte for byte: a redirection would give UTF-16 and CRLF,
          # and a bash or fish completion script with CRLF does not load.
          $utf8 = New-Object System.Text.UTF8Encoding $false
          foreach ($pair in @(
            @("bash", "chaps.bash"), @("zsh", "_chaps"),
            @("fish", "chaps.fish"), @("powershell", "_chaps.ps1")
          )) {
            $text = ((& $binary completions $pair[0]) -join "`n") + "`n"
            $out = Join-Path $PWD "dist/$dir/completions/$($pair[1])"
            [System.IO.File]::WriteAllText($out, $text, $utf8)
          }
          # The directory, not its contents, so the zip has the same
          # chaps-<version>-<target>/ top level the tar.gz archives have.
          Compress-Archive -Path "dist/$dir" -DestinationPath "dist/$asset"
          Remove-Item -Recurse -Force "dist/$dir"

      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # Cleanup lives in the calling job rather than in the composite action,
      # so the keychain goes away even when a later step fails.
      - name: Delete the temporary keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security list-keychains -d user -s login.keychain || true
          security delete-keychain build.keychain || true

  universal:
    name: build universal-apple-darwin
    needs: build
    runs-on: macos-latest
    env:
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      # Checked out for the README and LICENSE that go into the archive.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*-apple-darwin
          path: macos
          merge-multiple: true

      - name: Fuse the two macOS binaries with lipo
        id: lipo
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*) version="$GITHUB_REF_NAME" ;;
            *) version="dev-${GITHUB_SHA:0:7}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            tar -xzf "macos/chaps-${target}.tar.gz" -C macos
          done
          mkdir -p universal
          lipo -create -output universal/chaps \
            "macos/chaps-${version}-x86_64-apple-darwin/chaps" \
            "macos/chaps-${version}-aarch64-apple-darwin/chaps"
          lipo -info universal/chaps
          chmod 0755 universal/chaps

      # lipo rewrites the Mach-O container, which invalidates the per-slice
      # signatures, so the universal binary is signed and notarized again from
      # scratch rather than inheriting anything.
      - name: Sign and notarize
        if: env.HAS_APPLE == 'true'
        uses: ./.github/actions/sign-macos
        with:
          binary: universal/chaps
          label: universal-apple-darwin
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_PASSWORD }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package (tar.gz)
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.lipo.outputs.version }}"
          dir="chaps-${version}-universal-apple-darwin"
          asset="chaps-universal-apple-darwin.tar.gz"
          mkdir -p "dist/$dir/completions"
          cp universal/chaps "dist/$dir/"
          cp README.md "dist/$dir/"
          if [ -f LICENSE ]; then cp LICENSE "dist/$dir/"; fi
          universal/chaps completions bash       > "dist/$dir/completions/chaps.bash"
          universal/chaps completions zsh        > "dist/$dir/completions/_chaps"
          universal/chaps completions fish       > "dist/$dir/completions/chaps.fish"
          universal/chaps completions powershell > "dist/$dir/completions/_chaps.ps1"
          tar -czf "dist/$asset" -C dist "$dir"
          rm -rf "dist/$dir"

      - uses: actions/upload-artifact@v7
        with:
          name: archive-universal-apple-darwin
          path: dist/*
          if-no-files-found: error

      - name: Delete the temporary keychain
        if: always()
        shell: bash
        run: |
          security list-keychains -d user -s login.keychain || true
          security delete-keychain build.keychain || true

  publish:
    name: publish the release
    needs: [build, universal]
    # A workflow_dispatch run builds and uploads artifacts but creates nothing.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List what will be attached
        run: ls -l dist

      - name: Write SHA256SUMS over every archive
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum chaps-*.tar.gz chaps-*.zip > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Write the release notes
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          base="https://github.com/${repo}/releases/download/${tag}"
          cat > notes.md <<NOTES
          ### Downloads

          | Platform | File | Notes |
          | --- | --- | --- |
          | Linux x86_64 | [\`chaps-x86_64-unknown-linux-musl.tar.gz\`](${base}/chaps-x86_64-unknown-linux-musl.tar.gz) | static, any distro |
          | macOS | [\`chaps-universal-apple-darwin.tar.gz\`](${base}/chaps-universal-apple-darwin.tar.gz) | universal, signed and notarized |
          | Windows x86_64 | [\`chaps-x86_64-pc-windows-msvc.zip\`](${base}/chaps-x86_64-pc-windows-msvc.zip) | unsigned |

          <details>
          <summary>Other platforms</summary>

          | Platform | File | Notes |
          | --- | --- | --- |
          | Linux arm64 | [\`chaps-aarch64-unknown-linux-musl.tar.gz\`](${base}/chaps-aarch64-unknown-linux-musl.tar.gz) | static, any distro |
          | macOS, Apple silicon | [\`chaps-aarch64-apple-darwin.tar.gz\`](${base}/chaps-aarch64-apple-darwin.tar.gz) | signed and notarized |
          | macOS, Intel | [\`chaps-x86_64-apple-darwin.tar.gz\`](${base}/chaps-x86_64-apple-darwin.tar.gz) | signed and notarized |
          | Windows arm64 | [\`chaps-aarch64-pc-windows-msvc.zip\`](${base}/chaps-aarch64-pc-windows-msvc.zip) | unsigned |

          </details>

          Every archive holds the binary, \`README.md\`, \`LICENSE\` and shell
          completions under \`completions/\`.

          ### Install

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${repo}/main/install.sh | sh
          \`\`\`

          An installed \`chaps\` updates itself with \`chaps self update\`.

          ### Verify

          \`\`\`sh
          curl -fsSLO ${base}/SHA256SUMS
          shasum -a 256 -c SHA256SUMS --ignore-missing
          \`\`\`

          On macOS, check the signature of the extracted binary:

          \`\`\`sh
          codesign -dv --verbose=4 chaps
          \`\`\`
          NOTES
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
