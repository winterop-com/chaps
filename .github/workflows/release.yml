name: release
run-name: release ${{ github.ref_type == 'tag' && github.ref_name || 'dev (main)' }}

# Builds `chaps` for six targets natively, plus a universal macOS binary, and
# attaches the archives to a GitHub release.
#
# Two kinds of run publish. A `v*` tag publishes the stable release for that
# tag, exactly as before. A push to `main` publishes the same seven archives
# as a pre-release under the moving tag `dev`, which is the rolling build of
# `main`: same build, same signing and notarization, different release. The
# two publish jobs are guarded so that neither can run for the other's event.
#
# macOS archives are signed with a Developer ID Application certificate and
# notarized by Apple when these repository (or organisation) secrets are set.
# Without them the macOS build still succeeds and ships an UNSIGNED binary:
#
#   APPLE_CERTIFICATE            base64 of the exported Developer ID
#                                Application certificate (.p12)
#   APPLE_CERTIFICATE_PASSWORD   the .p12 export password
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                     the Apple ID email
#   APPLE_PASSWORD               an app-specific password (appleid.apple.com)
#   APPLE_TEAM_ID                the 10-character Team ID
#
# `scripts/github-secrets.sh` sets all six from 1Password.
#
# Windows binaries are not signed: that needs an Authenticode certificate,
# which is a separate purchase, so SmartScreen may warn on first run. The
# Linux builds are static musl and have nothing to sign.

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  # Lets the build matrix be exercised without cutting a release: neither
  # publish job runs for a dispatch from a branch. Signing still happens on a
  # dispatch run if the secrets are present, so the signing path is exercised
  # too.
  workflow_dispatch:

# Pushes to `main` arrive in bursts, and each one is seven builds with
# notarization. A branch run therefore cancels the one before it: the rolling
# release only ever wants the newest commit anyway. A tag run is a release and
# must never be cancelled, which is what the expression says; its group is the
# tag, which is unique to it, so nothing would cancel it in any case.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The packaging steps run the binary they just built, to generate the
  # completion scripts. Nothing in a release build should reach out to the
  # release feed while doing it.
  CHAPS_NO_UPDATE_CHECK: "1"
  # Which release series the binary being built follows. `build.rs` compiles
  # it in, `chaps self version` prints it as `channel`, and `chaps self
  # update` uses it to decide whether it follows `releases/latest` or the
  # rolling `dev` pre-release. A tag is stable; everything else, a branch push
  # and a dispatch alike, is a dev build, so a binary from a dispatch run is
  # never mistaken for a release build.
  CHAPS_BUILD_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'dev' }}

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # `secrets` is not available in a step-level `if:`, so whether the signing
    # certificate exists is hoisted into a job-level env var and the macOS
    # steps test that. The value is the string "true" or "false"; no secret
    # material is exposed.
    env:
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target is built natively, so no cross-compilation toolchains.
          # Linux builds are static (musl) so one binary runs on any distro.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Signing happens between the build and the packaging so the archive
      # contains the signed binary.
      - name: Sign and notarize
        if: runner.os == 'macOS' && env.HAS_APPLE == 'true'
        uses: ./.github/actions/sign-macos
        with:
          binary: target/${{ matrix.target }}/release/chaps
          label: ${{ matrix.target }}
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_PASSWORD }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}

      # Every target is built natively, so the binary that was just built is
      # the one that generates its own completion scripts.
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*) version="$GITHUB_REF_NAME" ;;
            *) version="dev-${GITHUB_SHA:0:7}" ;;
          esac
          # The archive is named after the target alone: the tag is already
          # in the download URL, and one name per target is also what
          # releases/latest/download/<name> needs. The directory inside the
          # archive keeps the version, because that is what someone sees
          # after unpacking it.
          dir="chaps-${version}-${{ matrix.target }}"
          asset="chaps-${{ matrix.target }}.tar.gz"
          binary="target/${{ matrix.target }}/release/chaps"
          mkdir -p "dist/$dir/completions"
          cp "$binary" "dist/$dir/"
          cp README.md "dist/$dir/"
          if [ -f LICENSE ]; then cp LICENSE "dist/$dir/"; fi
          "$binary" completions bash       > "dist/$dir/completions/chaps.bash"
          "$binary" completions zsh        > "dist/$dir/completions/_chaps"
          "$binary" completions fish       > "dist/$dir/completions/chaps.fish"
          "$binary" completions powershell > "dist/$dir/completions/_chaps.ps1"
          tar -czf "dist/$asset" -C dist "$dir"
          rm -rf "dist/$dir"

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = if ($env:GITHUB_REF -like "refs/tags/*") {
            $env:GITHUB_REF_NAME
          } else {
            "dev-" + $env:GITHUB_SHA.Substring(0, 7)
          }
          # The zip is named after the target alone; the directory inside
          # it keeps the version. See the tar.gz step.
          $dir = "chaps-$version-${{ matrix.target }}"
          $asset = "chaps-${{ matrix.target }}.zip"
          # Absolute, so the call operator below cannot mistake it for a
          # command name.
          $binary = Join-Path $PWD "target/${{ matrix.target }}/release/chaps.exe"
          New-Item -ItemType Directory -Force -Path "dist/$dir/completions" | Out-Null
          Copy-Item $binary "dist/$dir/"
          Copy-Item "README.md" "dist/$dir/"
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "dist/$dir/" }
          # Written byte for byte: a redirection would give UTF-16 and CRLF,
          # and a bash or fish completion script with CRLF does not load.
          $utf8 = New-Object System.Text.UTF8Encoding $false
          foreach ($pair in @(
            @("bash", "chaps.bash"), @("zsh", "_chaps"),
            @("fish", "chaps.fish"), @("powershell", "_chaps.ps1")
          )) {
            $text = ((& $binary completions $pair[0]) -join "`n") + "`n"
            $out = Join-Path $PWD "dist/$dir/completions/$($pair[1])"
            [System.IO.File]::WriteAllText($out, $text, $utf8)
          }
          # The directory, not its contents, so the zip has the same
          # chaps-<version>-<target>/ top level the tar.gz archives have.
          Compress-Archive -Path "dist/$dir" -DestinationPath "dist/$asset"
          Remove-Item -Recurse -Force "dist/$dir"

      - uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # Cleanup lives in the calling job rather than in the composite action,
      # so the keychain goes away even when a later step fails.
      - name: Delete the temporary keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security list-keychains -d user -s login.keychain || true
          security delete-keychain build.keychain || true

  universal:
    name: build universal-apple-darwin
    needs: build
    runs-on: macos-latest
    env:
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      # Checked out for the README and LICENSE that go into the archive.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*-apple-darwin
          path: macos
          merge-multiple: true

      - name: Fuse the two macOS binaries with lipo
        id: lipo
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*) version="$GITHUB_REF_NAME" ;;
            *) version="dev-${GITHUB_SHA:0:7}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for target in x86_64-apple-darwin aarch64-apple-darwin; do
            tar -xzf "macos/chaps-${target}.tar.gz" -C macos
          done
          mkdir -p universal
          lipo -create -output universal/chaps \
            "macos/chaps-${version}-x86_64-apple-darwin/chaps" \
            "macos/chaps-${version}-aarch64-apple-darwin/chaps"
          lipo -info universal/chaps
          chmod 0755 universal/chaps

      # lipo rewrites the Mach-O container, which invalidates the per-slice
      # signatures, so the universal binary is signed and notarized again from
      # scratch rather than inheriting anything.
      - name: Sign and notarize
        if: env.HAS_APPLE == 'true'
        uses: ./.github/actions/sign-macos
        with:
          binary: universal/chaps
          label: universal-apple-darwin
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          signing-identity: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_PASSWORD }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}

      - name: Package (tar.gz)
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.lipo.outputs.version }}"
          dir="chaps-${version}-universal-apple-darwin"
          asset="chaps-universal-apple-darwin.tar.gz"
          mkdir -p "dist/$dir/completions"
          cp universal/chaps "dist/$dir/"
          cp README.md "dist/$dir/"
          if [ -f LICENSE ]; then cp LICENSE "dist/$dir/"; fi
          universal/chaps completions bash       > "dist/$dir/completions/chaps.bash"
          universal/chaps completions zsh        > "dist/$dir/completions/_chaps"
          universal/chaps completions fish       > "dist/$dir/completions/chaps.fish"
          universal/chaps completions powershell > "dist/$dir/completions/_chaps.ps1"
          tar -czf "dist/$asset" -C dist "$dir"
          rm -rf "dist/$dir"

      - uses: actions/upload-artifact@v7
        with:
          name: archive-universal-apple-darwin
          path: dist/*
          if-no-files-found: error

      - name: Delete the temporary keychain
        if: always()
        shell: bash
        run: |
          security list-keychains -d user -s login.keychain || true
          security delete-keychain build.keychain || true

  publish:
    name: publish the release
    needs: [build, universal]
    # A tag and nothing else: a push to `main` goes to publish-dev below, and
    # a workflow_dispatch run from a branch builds and uploads artifacts but
    # creates nothing.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `fetch-depth: 0` because the notes list the commits since the previous
      # tag: the whole history and every tag have to be there, not the single
      # commit a default checkout brings.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List what will be attached
        run: ls -l dist

      - name: Write SHA256SUMS over every archive
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum chaps-*.tar.gz chaps-*.zip > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      # The notes themselves live in a script so they can be read before the
      # tag is pushed: `scripts/release-notes.sh v0.2.4` on a checkout prints
      # exactly what the release will say.
      - name: Write the release notes
        run: |
          set -euo pipefail
          scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: notes.md
          # The notes above list the commits themselves. GitHub's generated
          # notes list merged pull requests, and this repository pushes to
          # `main`, so they only ever added a "Full changelog" link.
          generate_release_notes: false
          fail_on_unmatched_files: true

  publish-dev:
    name: publish the dev pre-release
    needs: [build, universal]
    # A push to `main` and nothing else: not a tag, which the job above
    # publishes, and not a workflow_dispatch, which publishes nothing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The one moving tag the rolling build is published under.
      DEV_TAG: dev
    steps:
      # Checked out for Cargo.toml, which the notes quote, and for the git
      # remote the tag is pushed to. `fetch-depth: 0` because the notes also
      # list the commits since the last version tag, so the whole history and
      # every tag have to be there.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List what will be attached
        run: ls -l dist

      - name: Write SHA256SUMS over every archive
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum chaps-*.tar.gz chaps-*.zip > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      # The tag is moved here rather than left to the release action.
      # GitHub's create-a-release and update-a-release APIs both document
      # target_commitish as "unused if the Git tag already exists", and `dev`
      # exists from the first rolling build onwards, so passing it would move
      # the tag exactly once and then quietly stop. A force-push is the only
      # thing that moves a tag that is already there, and it happens before
      # the release is written so the release never points at a commit whose
      # tag has not caught up.
      - name: Move the dev tag to this commit
        run: |
          set -euo pipefail
          git tag -f "$DEV_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$DEV_TAG"

      # The same script the tag path uses, in its `dev` shape:
      # `scripts/release-notes.sh dev` on a checkout prints what this release
      # will say. `chaps self update` reads the commit back out of the notes,
      # from the "Built from commit" line the script writes.
      - name: Write the release notes
        run: |
          set -euo pipefail
          scripts/release-notes.sh "$DEV_TAG" > notes.md
          cat notes.md

      # softprops/action-gh-release documents `overwrite_files` as defaulting
      # to true, so each of the eight files replaces the asset of the same
      # name on the existing release; the release itself is reused because
      # "if a tag already has a GitHub release, the existing release will be
      # updated with the release assets". name, body and prerelease are all
      # set explicitly, because the action documents that release info it is
      # not given is left as it was.
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          name: dev (rolling build of main)
          tag_name: dev
          body_path: notes.md
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true

      # Overwriting covers every asset this build produced, but not one an
      # older build left behind under a name this one no longer writes, such
      # as a target that was renamed or dropped. Those are removed after the
      # upload, so the release only ever lists files from this commit and the
      # release is never briefly missing an asset.
      - name: Delete assets no longer built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$DEV_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > attached.txt
          while read -r name; do
            [ -n "$name" ] || continue
            if [ ! -e "dist/$name" ]; then
              echo "removing stale asset $name"
              gh release delete-asset "$DEV_TAG" "$name" \
                --repo "$GITHUB_REPOSITORY" --yes
            fi
          done < attached.txt
