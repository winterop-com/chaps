# CHAP Model Marketplace — registry index
#
# This file is the entry point for the marketplace site. Every model listed
# here has been reviewed and verified by the CHAP maintainers; a model (or a
# new version of one) only lands in this repo through a pull request approved
# by three maintainers.
#
# The site renders this repo — the repo stays the source of truth and the
# review gate. See models/README.md for the per-model file format.
#
# Verification is about the pin, not the forecast: the gate checks that a
# pinned revision is what it claims to be and runs as a chapkit service. What
# the model's own authors will vouch for is a separate axis, carried per
# model as `assessed_status` and surfaced as such by the site.

schema_version: 2

marketplace:
  name: CHAP Model Marketplace
  description: >-
    Curated, verified forecasting models for CHAP, the Climate & Health
    Analytics Platform. Every listed model and every version pin is reviewed
    by the CHAP maintainers before it appears here.
  # The marketplace's own repository. The site build ingests this repo's open
  # pull requests so an in-review model or version pin can appear on the site
  # with its running approval count before it merges.
  repository: https://github.com/dhis2-chap/model-marketplace
  documentation:
    chap: https://chap.dhis2.org
    # Only chapkit model services are supported. Every listed model is a
    # chapkit 2.0.0 service published as a container image; the install guide
    # is chapkit's own deployment walkthrough.
    install: https://dhis2-chap.github.io/chapkit/guides/deploying-to-chap-core/
    # How CHAP talks to a running chapkit service over HTTP.
    chap_chapkit: https://chap.dhis2.org/chap-modeling-platform/external_models/chapkit/
    chapkit: https://dhis2-chap.github.io/chapkit/
    # The chapkit base images the listed services are built on.
    runtimes: https://github.com/dhis2-chap/chapkit-images

review_policy:
  required_approvals: 3
  note: >-
    New models and new version pins are proposed as pull requests against this
    repository and must be approved by three maintainers before merge.

# Ordered list of whitelisted models. Each entry is a standalone YAML file;
# whether it is a forecasting model or a template to copy is declared inside
# the file as `kind`.
models:
  # Forecasting models.
  - models/chapkit_ewars_model.yaml
  - models/chapkit_rwanda_malaria_bym_model.yaml
  - models/chapkit_simple_multistep_model.yaml
  - models/auto_arima_chapkit.yaml
  # Templates — scaffolding for model authors, not models.
  - models/chapkit_minimalist_example_py.yaml
  - models/chapkit_minimalist_example_r.yaml
