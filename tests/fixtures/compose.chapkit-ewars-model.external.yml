# Generated by chaps from .chaps/; edit there and run `chaps sync`.
# chapkit_ewars_model 1.0.4 (https://github.com/chap-models/chapkit_ewars_model)
services:
  chapkit-ewars-model:
    labels:
      com.winterop.chaps.role: model
      com.winterop.chaps.model: "chapkit_ewars_model"
      com.winterop.chaps.kind: init
    restart: unless-stopped
    image: ghcr.io/chap-models/chapkit_ewars_model:${CHAPKIT_EWARS_MODEL_IMAGE_TAG:-sha-964eea8}
    platform: linux/amd64
    init: true
    expose:
      - "5001"
    ports:
      - "5001:5001"
    environment:
      SERVICEKIT_ORCHESTRATOR_URL: http://host.docker.internal:8000/v2/services/$$register
      SERVICEKIT_HOST: localhost
      PORT: "5001"
      SERVICEKIT_PORT: "5001"
      # Uncomment if chap has SERVICEKIT_REGISTRATION_KEY set:
      # SERVICEKIT_REGISTRATION_KEY: ${SERVICEKIT_REGISTRATION_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: 1000:1000
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 2000000000
      - type: volume
        source: ck_chapkit_ewars_model_data
        target: /app/data
    depends_on:
      chapkit-ewars-model-init:
        condition: service_completed_successfully

  chapkit-ewars-model-init:
    labels:
      com.winterop.chaps.role: model
      com.winterop.chaps.model: "chapkit_ewars_model"
      com.winterop.chaps.kind: init
    image: busybox:1.38
    command: ["sh", "-c", "chown -R 1000:1000 /app/data"]
    user: "0:0"
    volumes:
      - type: volume
        source: ck_chapkit_ewars_model_data
        target: /app/data
    restart: "no"

volumes:
  ck_chapkit_ewars_model_data: {}
