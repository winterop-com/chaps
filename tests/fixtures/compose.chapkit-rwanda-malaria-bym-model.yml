# Generated by chaps from .chaps/; edit there and run `chaps sync`.
# chapkit_rwanda_malaria_bym_model 0.1.0 (https://github.com/chap-models/chapkit_rwanda_malaria_bym_model)
services:
  chapkit-rwanda-malaria-bym-model:
    restart: unless-stopped
    image: ghcr.io/chap-models/chapkit_rwanda_malaria_bym_model:${CHAPKIT_RWANDA_MALARIA_BYM_MODEL_IMAGE_TAG:-sha-028bb5a}
    # amd64-only image; the pin makes an arm64 host pull that variant.
    platform: linux/amd64
    init: true
    expose:
      - "8000"
    environment:
      # $$ is a literal $ for compose.
      SERVICEKIT_ORCHESTRATOR_URL: http://chap:8000/v2/services/$$register
      # Uncomment if chap has SERVICEKIT_REGISTRATION_KEY set:
      # SERVICEKIT_REGISTRATION_KEY: ${SERVICEKIT_REGISTRATION_KEY:-}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 2000000000 # 2GB for model workspaces
      - type: volume
        source: ck_chapkit_rwanda_malaria_bym_model_data
        target: /work/data
    depends_on:
      chapkit-rwanda-malaria-bym-model-init:
        condition: service_completed_successfully
      chap:
        condition: service_healthy

  chapkit-rwanda-malaria-bym-model-init:
    # One-shot: chowns the data volume so the model can write to it, then exits.
    image: busybox:1.37
    command: ["sh", "-c", "chown -R 0:0 /work/data"]
    user: "0:0"
    volumes:
      - type: volume
        source: ck_chapkit_rwanda_malaria_bym_model_data
        target: /work/data
    restart: "no"

volumes:
  ck_chapkit_rwanda_malaria_bym_model_data: {}
