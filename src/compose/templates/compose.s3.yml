# compose.s3.yml - generated by chaps (@CLI_VERSION@); rendered from .chaps/components.yaml by `chaps sync`.
# Component: s3 - RustFS, an S3-compatible object store, https://github.com/rustfs/rustfs
# The credentials come from S3_ACCESS_KEY and S3_SECRET_KEY in .env, which chaps
# generates once; set @TAG_VAR@ there to run a different build.
services:
  s3:
    restart: unless-stopped
    image: @IMAGE@:${@TAG_VAR@:-@IMAGE_TAG@}
    # Multi-arch (linux/amd64 and linux/arm64), so no platform pin.
    init: true
    environment:
      # The image's own spelling of the root credentials; compose substitutes
      # both from the .env beside this file, which is the only place they live.
      RUSTFS_ACCESS_KEY: ${@ACCESS_KEY_VAR@:-}
      RUSTFS_SECRET_KEY: ${@SECRET_KEY_VAR@:-}
      RUSTFS_VOLUMES: /data
@PORT_LINES@    volumes:
      - type: volume
        source: @VOLUME@
        target: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:@CONTAINER_PORT@/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # No `networks:` on purpose: the default network is where OCS reaches this.

  s3-init:
    # One-shot: create the bucket OCS will use, then exit. curl signs the
    # request itself (--aws-sigv4), so this needs no second image, and creating
    # a bucket that already exists answers 200 - re-running changes nothing.
    # ($$ is a literal $ for compose: the shell inside the container expands it.)
    image: @IMAGE@:${@TAG_VAR@:-@IMAGE_TAG@}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        curl -sSf --retry 10 --retry-delay 2 --retry-all-errors
        --aws-sigv4 "aws:amz:@REGION@:s3"
        -u "$${@ACCESS_KEY_VAR@}:$${@SECRET_KEY_VAR@}"
        -X PUT "http://s3:@CONTAINER_PORT@/@BUCKET@"
    environment:
      @ACCESS_KEY_VAR@: ${@ACCESS_KEY_VAR@:-}
      @SECRET_KEY_VAR@: ${@SECRET_KEY_VAR@:-}
    depends_on:
      s3:
        condition: service_healthy
    # This is the one service here that is not `restart: unless-stopped`: it
    # runs once per start and exits. (`no` has to be quoted; bare no is YAML false.)
    restart: "no"

volumes:
  @VOLUME@: {}
