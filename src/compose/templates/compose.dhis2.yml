# Generated by chaps from .chaps/; edit there and run `chaps sync`.
# dhis2: DHIS2, the district health information system (https://dhis2.org)
services:
  dhis2:
@LABELS@    restart: unless-stopped
    image: @IMAGE@:${@TAG_VAR@:-@IMAGE_TAG@}
    init: true
@PORT_LINES@    environment:
      # JAVA_TOOL_OPTIONS, not JAVA_OPTS: it is the JVM's own variable and works
      # for both image variants, while the distroless one ignores JAVA_OPTS and
      # then sizes the heap at about a quarter of the machine's memory.
      JAVA_TOOL_OPTIONS: ${DHIS2_JAVA_TOOL_OPTIONS:--Xms2g -Xmx4g -XX:+UseG1GC}
      # The five values `@CONFIG_PATH@` substitutes into its ${...} placeholders.
      DHIS2_DB_HOST: ${DHIS2_DB_HOST:-dhis2-db}
      DHIS2_DB_NAME: ${DHIS2_DB_NAME:-dhis}
      DHIS2_DB_USER: ${DHIS2_DB_USER:-dhis}
      DHIS2_DB_PASSWORD: ${DHIS2_DB_PASSWORD:-dhis}
      # Passed even when nothing sets it, so the placeholder in the file becomes
      # the empty string rather than standing there as a literal.
      DHIS2_ENCRYPTION_PASSWORD: ${DHIS2_ENCRYPTION_PASSWORD:-}
    volumes:
      # dhis.conf is mandatory: DHIS2 throws on startup without it, and there is
      # no environment-only mode.
      - ./@CONFIG_PATH@:/opt/dhis2/dhis.conf:ro
      # /opt/dhis2 holds the installed apps and the file store, so it has to
      # outlive a recreate. The volume covers the directory the line above mounts
      # into; docker orders mounts by destination depth, so the volume goes down
      # first and the file lands on top of it.
      - type: volume
        source: @HOME_VOLUME@
        target: /opt/dhis2
    healthcheck:
      # /api/ping is the one route that answers unauthenticated. `curl` is left
      # to PATH, which finds it wherever the image variant keeps it.
      test: ["CMD", "curl", "-fsS", "http://localhost:@CONTAINER_PORT@/api/ping"]
      interval: 15s
      timeout: 10s
      # A cold boot is around 40s native and 8 to 15 minutes under emulation.
      start_period: 240s
      retries: 60
    depends_on:
      dhis2-db:
        condition: service_healthy
      dhis2-prep:
        condition: service_completed_successfully

  dhis2-db:
@LABELS@    restart: unless-stopped
    # PostGIS rather than plain postgres, and not as an optimisation: DHIS2's own
    # startup check throws without the postgis, pg_trgm and btree_gin extensions.
    image: @DB_IMAGE@
    environment:
      POSTGRES_DB: ${DHIS2_DB_NAME:-dhis}
      POSTGRES_USER: ${DHIS2_DB_USER:-dhis}
      POSTGRES_PASSWORD: ${DHIS2_DB_PASSWORD:-dhis}
    healthcheck:
      # Over TCP on purpose. While the entrypoint runs the init scripts the
      # server listens on the unix socket alone, so a socket probe would report a
      # half-restored database as ready.
@DB_HEALTH_TEST@
      interval: 10s
      timeout: 5s
      # Generous, because on a seeded deployment the first start is the restore.
      start_period: 600s
      retries: 30
    expose:
      - "5432"
    volumes:
      - type: volume
        source: @DB_VOLUME@
        target: /var/lib/postgresql/data
@DUMP_MOUNT@@DUMP_DEPENDS@@DUMP_SERVICE@
  dhis2-prep:
    # One-shot: runs after the restore and before DHIS2 boots, on every start.
    # Two things, neither of them visible from the outside.
    #   1. ANALYZE. A freshly restored dump carries no planner statistics, so the
    #      analytics aggregations get terrible query plans: measured here, the
    #      first analytics run took about 20 minutes instead of about 20 seconds.
    #      Autovacuum gets there eventually, but not before that first run.
    #   2. Reset any job a hard stop left flagged RUNNING. DHIS2 will not start a
    #      new analytics run while one is RUNNING, so one stale row blocks
    #      analytics forever.
    # ON_ERROR_STOP=0 so a database DHIS2 has not migrated yet, which has no
    # jobconfiguration table, is a no-op rather than a failure.
@LABELS@    image: @DB_IMAGE@
    restart: "no"
    environment:
      PGHOST: ${DHIS2_DB_HOST:-dhis2-db}
      PGDATABASE: ${DHIS2_DB_NAME:-dhis}
      PGUSER: ${DHIS2_DB_USER:-dhis}
      PGPASSWORD: ${DHIS2_DB_PASSWORD:-dhis}
    entrypoint: ["psql"]
    command:
      - "-v"
      - "ON_ERROR_STOP=0"
      - "-c"
      - "UPDATE jobconfiguration SET jobstatus='SCHEDULED' WHERE jobstatus='RUNNING';"
      - "-c"
      - "ANALYZE;"
    depends_on:
      dhis2-db:
        condition: service_healthy

volumes:
  @DB_VOLUME@: {}
@DUMP_VOLUME_LINE@  @HOME_VOLUME@: {}
