# Written once by varde when the dhis2 component was enabled; varde never rewrites it.

# DHIS2 loads this file at startup - it will not start without it - and replaces
# every ${...} below with the environment variable of that name. The dhis2
# service in compose.dhis2.yml passes all five of them.

connection.dialect = org.hibernate.dialect.PostgreSQLDialect
connection.url = jdbc:postgresql://${DHIS2_DB_HOST}/${DHIS2_DB_NAME}
connection.username = ${DHIS2_DB_USER}
connection.password = ${DHIS2_DB_PASSWORD}
# connection.driver_class = org.postgresql.Driver   # this is already the default

# 24 characters or more. Shorter and DHIS2 reports ENCRYPTION_PASSWORD_TOO_SHORT;
# empty and it reports MISSING_ENCRYPTION_PASSWORD and encrypts with a password
# compiled into DHIS2, which every other DHIS2 in the world also has.
encryption.password = ${DHIS2_ENCRYPTION_PASSWORD}

# The route targets DHIS2 is willing to proxy to. Version 42 and later default to
# `https://*` and then refuse an http:// target, which is the one the Modeling App
# needs: it reaches chap-core through a DHIS2 Route rather than directly. Every
# http and https target is allowed, so any chap-core works without editing this
# line; narrow it to the origins you use on a DHIS2 that is not a test instance.
# One origin per entry, comma separated, and none of them may carry a path -
# DHIS2 throws on startup if one does.
route.remote_servers_allowed = @ROUTE_ALLOWED@

# Behind a TLS-terminating proxy, uncomment both: the first marks the session
# cookie Secure, the second is the origin DHIS2 builds absolute links from. Leave
# them commented while DHIS2 is reached over plain http, or the login will loop.
# server.https = on
# server.base.url = https://dhis2.example.org

# Restoring a dump from an older DHIS2 than the image runs can stop on Flyway's
# migration order. These two let it carry on.
# flyway.repair_before_migration = on
# flyway.migrate_out_of_order = on
