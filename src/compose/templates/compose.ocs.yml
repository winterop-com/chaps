# Generated by chaps from .chaps/; edit there and run `chaps sync`.
# ocs: Open Climate Service (https://github.com/dhis2/open-climate-service)
services:
  ocs:
    restart: unless-stopped
    image: @IMAGE@:${@TAG_VAR@:-@IMAGE_TAG@}
    init: true
    ports:
      - "@HOST_PORT@:@CONTAINER_PORT@"
    environment:
      PORT: "@CONTAINER_PORT@"
      CLIMATE_SERVICE_CONFIG: /app/climate-service.yaml
@S3_LINES@    volumes:
      - ./@CONFIG_PATH@:/app/climate-service.yaml:ro
      - type: volume
        source: @VOLUME@
        target: /app/data

volumes:
  @VOLUME@: {}
