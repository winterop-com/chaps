# compose.ocs.yml - generated by chaps (@CLI_VERSION@); rendered from .chaps/components.yaml by `chaps sync`.
# Component: ocs - Open Climate Service, https://github.com/dhis2/open-climate-service
# OCS publishes no release tags yet, so the pin follows the moving `main` tag;
# set @TAG_VAR@ in .env to run a different build.
services:
  ocs:
    restart: unless-stopped
    image: @IMAGE@:${@TAG_VAR@:-@IMAGE_TAG@}
    # Multi-arch (linux/amd64 and linux/arm64), so no platform pin: an arm64
    # host runs this one natively even though chap-core does not.
    init: true
    # OCS serves a web interface as well as the API, so it is published by
    # default; `chaps components enable ocs --port N` moves it. chap-core
    # reaches it at http://ocs:@CONTAINER_PORT@ on the compose default network.
    ports:
      - "@HOST_PORT@:@CONTAINER_PORT@"
    environment:
      PORT: "@CONTAINER_PORT@"
      # The instance config below, mounted read-only from ./ocs/.
      CLIMATE_SERVICE_CONFIG: /app/climate-service.yaml
@S3_LINES@    # ROOT_PATH is deliberately unset: this service is reached on its own port,
    # not under a prefix. Set it in a compose file of your own behind a proxy.
    volumes:
      - ./@CONFIG_PATH@:/app/climate-service.yaml:ro
      - type: volume
        source: @VOLUME@
        target: /app/data
    # No `networks:` on purpose: the default network reaches chap but not redis/postgres.
    # No healthcheck: the OCS image ships its own (curl -f /health).
    # No `depends_on`: OCS and chap-core come up independently of each other.

volumes:
  @VOLUME@: {}
