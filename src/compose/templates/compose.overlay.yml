# Generated by chaps from .chaps/; edit there and run `chaps sync`.
# @ID@ @VERSION@ (@REPOSITORY@)
services:
  @SERVICE_ID@:
    restart: unless-stopped
    image: @IMAGE@@TAG_SEP@${@TAG_VAR@:-@IMAGE_TAG@}
@PLATFORM_LINE@    init: true
@PORT_LINES@    environment:
      # $$ is a literal $ for compose.
      SERVICEKIT_ORCHESTRATOR_URL: http://chap:8000/v2/services/$$register
@REGISTRATION_KEY_LINES@
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: @USER@
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 2000000000 # 2GB for model workspaces
      - type: volume
        source: @VOLUME@
        target: @DATA_DIR@
    depends_on:
      @SERVICE_ID@-init:
        condition: service_completed_successfully
      chap:
        condition: service_healthy

  @SERVICE_ID@-init:
    # One-shot: chowns the data volume so the model can write to it, then exits.
    image: busybox:1.37
    command: ["sh", "-c", "chown @UID_GID@ @DATA_DIR@"]
    user: "0:0"
    volumes:
      - type: volume
        source: @VOLUME@
        target: @DATA_DIR@
    restart: "no"

volumes:
  @VOLUME@: {}
