# Generated by chaps from .chaps/; edit there and run `chaps sync`.
# @ID@ @VERSION@ (@REPOSITORY@)
services:
  @SERVICE_ID@:
    restart: unless-stopped
    image: @IMAGE@@TAG_SEP@${@TAG_VAR@:-@IMAGE_TAG@}
@PLATFORM_LINE@    init: true
@PORT_LINES@@ENVIRONMENT_LINES@    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
@USER_LINE@    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 2000000000 # 2GB for model workspaces
      - type: volume
        source: @VOLUME@
        target: @DATA_DIR@
    depends_on:
@INIT_DEPENDS@@CHAP_DEPENDS@@INIT_SERVICE@volumes:
  @VOLUME@: {}
